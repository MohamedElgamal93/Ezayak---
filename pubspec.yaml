version: 1.4.1

environment:
  sdk: ">=2.2.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  smooth_page_indicator: ^0.1.5
  flutter_secure_storage: ^3.3.1+1
  #  webview_flutter: ^0.3.10
  open_file: ^3.0.1
#  flutter_webview_plugin: 0.3.10+1
 # flutter_inappwebview: ^3.3.0+3
  permission_handler: ^5.0.1
  path_provider: ^1.6.10
  http: ^0.12.0+2
  #  airship_flutter: ^3.0.1
  local_auth: ^0.6.2+3
  shared_preferences: ^0.5.6
  table_calendar: ^2.2.3
  provider: ^3.1.0
  location: ^3.0.2
  flutter_local_notifications: ^0.8.4+3
#  pedantic: ^1.4.0
  pin_code_fields: ^2.5.1
  url_launcher: ^5.0.3
  li_webview: ^0.0.1
  charts_flutter: ^0.9.0
  dio : any
  app_settings: 4.0.1+1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^0.10.0
  json_serializable: ^1.0.0
  flutter_launcher_icons: "^0.7.3"
  page_view_indicators: ^1.3.1

flutter_icons:
  ios: true
  android: true
  image_path: "assets/3.0x/ezyeakLogo.png"
  adaptive_icon_background: "#FFFFFF"
  adapptive_icon_foreground: "assets/3.0x/ezyeakLogo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
